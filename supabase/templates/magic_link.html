<div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:440px;margin:0 auto;padding:32px 24px;color:#0E0E0E;background:#FFFFFF">
  <p style="margin:0 0 4px;font-size:13px;color:#6B6B6B">Anaból[IA]</p>
  <h1 style="margin:0 0 12px;font-size:26px;line-height:1.15;font-weight:700">Entrar</h1>
  <p style="margin:0 0 24px;font-size:15px;line-height:1.45;color:#6B6B6B">Toque no botão para entrar na sua conta.</p>
  <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#D4451F;color:#FFFFFF;font-size:16px;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:999px">Entrar no Anaból[IA]</a>
  <p style="margin:28px 0 8px;font-size:15px;line-height:1.45;color:#6B6B6B">Se o link abrir em outro navegador ou fora do app, digite este código no Anaból[IA]:</p>
  <p style="margin:0;font-size:28px;font-weight:700;letter-spacing:6px">{{ .Token }}</p>
  <p style="margin:28px 0 0;font-size:13px;line-height:1.45;color:#6B6B6B">O link e o código valem por 1 hora e só uma vez. Não pediu? Pode ignorar este e-mail.</p>
</div>
